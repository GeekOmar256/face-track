{% extends "base.html" %}
{% block content %}
<h2>Student List</h2>

<table>
  <thead>
    <tr>
      <th>Student ID</th>
      <th>Name</th>
      <th>Date Added</th>
      <th>Photos</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    {% for s in students %}
    <tr>
      <td>{{ s.student_id }}</td>
      <td>{{ s.name }}</td>
      <td>{{ s.date_added }}</td>
      <td>{{ s.photo_count }}</td>
      <td>
        <form method="post" action="{{ url_for('facetrack.delete_student', pk=s.id) }}"
              onsubmit="return confirm('Delete {{ s.name }} (ID {{ s.student_id }})? This removes their photos and attendance history, and retrains the model.');">
          <button type="submit" class="btn btn-danger">Delete</button>
        </form>
      </td>
    </tr>
    {% else %}
    <tr><td colspan="5">No students enrolled yet.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
